        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8CA924',
                        'primary-dark': '#758F1D',
                        background: '#0A0A0A',
                        surface: '#121212',
                        'surface-light': '#1A1A1A'
                    },
                    fontFamily: {
                        display: ['Anton', 'sans-serif'],
                        body: ['Inter', 'sans-serif'],
                        heading: ['Oswald', 'sans-serif'],
                        tech: ['Space Grotesk', 'sans-serif']
                    },
                    backgroundImage: {
                        'moss-radial': 'radial-gradient(circle at center, rgba(140, 169, 36, 0.1) 0%, rgba(10, 10, 10, 0) 70%)',
                        'grid-pattern': 'linear-gradient(to right, #333 1px, transparent 1px), linear-gradient(to bottom, #333 1px, transparent 1px)'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes scan {
            0% {
                top: 0%;
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                top: 100%;
                opacity: 0;
            }
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-150%) skewX(-25deg);
            }

            100% {
                transform: translateX(150%) skewX(-25deg);
            }
        }

        @keyframes glowPulse {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(140, 169, 36, 0.3);
            }

            50% {
                box-shadow: 0 0 30px rgba(140, 169, 36, 0.6);
            }
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        .animate-float {
            animation: float 6s ease-in-out infinite;
        }

        .scanner-line {
            animation: scan 4s linear infinite;
        }

        .shimmer-effect {
            position: relative;
            overflow: hidden;
        }

        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.2),
                    transparent);
            transform: translateX(-150%) skewX(-25deg);
        }

        .shimmer-effect:hover::after {
            animation: shimmer 0.75s ease-out;
        }

        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.1);
            color: transparent;
        }

        html {
            scroll-behavior: initial !important;
        }

        html.lenis,
        html.lenis body {
            height: auto;
        }

        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }

        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }

        .lenis.lenis-stopped {
            overflow: hidden;
        }

        .lenis.lenis-scrolling iframe {
            pointer-events: none;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        canvas {
            touch-action: none;
        }
    </style>
